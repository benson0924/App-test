name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web textbook
        run: npm run build
        env:
          VITE_BASE: /docs/

      - name: SPA fallback for client-side routing
        run: cp web/dist/index.html web/dist/404.html

      - name: Publish to docs/ on main
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/dist
          target-folder: docs
          branch: main
          commit-message: Deploy site to docs/
